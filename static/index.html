<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10131d" />
    <title>Calculator</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/calculator.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Calculator">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">∑</span>
            <div>
              <p class="eyebrow">EVERYDAY TOOLS</p>
              <h1>Calculator</h1>
            </div>
          </div>
          <span class="status"><span></span> Ready</span>
        </header>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div id="expression" class="expression" aria-label="Expression">&nbsp;</div>
          <output id="result" class="result" aria-label="Result">0</output>
        </div>

        <div class="keypad" aria-label="Calculator keys">
          <button class="key key-utility" data-action="clear" type="button">AC</button>
          <button class="key key-utility" data-action="backspace" type="button" aria-label="Delete last character">⌫</button>
          <button class="key key-utility" data-value="(" type="button">(</button>
          <button class="key key-operator" data-value="/" type="button" aria-label="Divide">÷</button>

          <button class="key" data-value="7" type="button">7</button>
          <button class="key" data-value="8" type="button">8</button>
          <button class="key" data-value="9" type="button">9</button>
          <button class="key key-operator" data-value="*" type="button" aria-label="Multiply">×</button>

          <button class="key" data-value="4" type="button">4</button>
          <button class="key" data-value="5" type="button">5</button>
          <button class="key" data-value="6" type="button">6</button>
          <button class="key key-operator" data-value="-" type="button" aria-label="Subtract">−</button>

          <button class="key" data-value="1" type="button">1</button>
          <button class="key" data-value="2" type="button">2</button>
          <button class="key" data-value="3" type="button">3</button>
          <button class="key key-operator" data-value="+" type="button" aria-label="Add">+</button>

          <button class="key key-utility" data-value=")" type="button">)</button>
          <button class="key" data-value="0" type="button">0</button>
          <button class="key" data-value="." type="button">.</button>
          <button class="key key-equals" data-action="calculate" type="button" aria-label="Calculate">=</button>
        </div>

        <p class="hint">Use your keyboard · Enter to calculate · Esc to clear</p>
      </section>
      <footer>Thoughtfully simple, by design.</footer>
    </main>
  </body>
</html>
